<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="700" height="320" fill="#F3F7F6"/>
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F5C66">Clavier AZERTY (France)</text>

  <!-- Row 1: number row -->
  <g font-size="15" fill="#1F2937">
    <!-- Row: AZERTY letters -->
    <!-- key template function replicated manually -->
  </g>

  <!-- Top letter row: A Z E R T Y U I O P -->
  <g>
    <!-- key backgrounds -->
    <g fill="#FFFFFF" stroke="#0F5C66" stroke-width="2">
      <rect x="40"  y="70" width="55" height="55" rx="8"/>
      <rect x="100" y="70" width="55" height="55" rx="8"/>
      <rect x="160" y="70" width="55" height="55" rx="8"/>
      <rect x="220" y="70" width="55" height="55" rx="8"/>
      <rect x="280" y="70" width="55" height="55" rx="8"/>
      <rect x="340" y="70" width="55" height="55" rx="8"/>
      <rect x="400" y="70" width="55" height="55" rx="8"/>
      <rect x="460" y="70" width="55" height="55" rx="8"/>
      <rect x="520" y="70" width="55" height="55" rx="8"/>
      <rect x="580" y="70" width="55" height="55" rx="8"/>
    </g>
    <g font-size="24" font-weight="bold" fill="#D1451C" text-anchor="middle">
      <text x="67"  y="105">A</text>
      <text x="127" y="105">Z</text>
      <text x="187" y="105">E</text>
      <text x="247" y="105">R</text>
      <text x="307" y="105">T</text>
      <text x="367" y="105">Y</text>
      <text x="427" y="105">U</text>
      <text x="487" y="105">I</text>
      <text x="547" y="105">O</text>
      <text x="607" y="105">P</text>
    </g>
  </g>

  <!-- Second row: Q S D F G H J K L M -->
  <g>
    <g fill="#FFFFFF" stroke="#0F5C66" stroke-width="2">
      <rect x="60"  y="135" width="55" height="55" rx="8"/>
      <rect x="120" y="135" width="55" height="55" rx="8"/>
      <rect x="180" y="135" width="55" height="55" rx="8"/>
      <rect x="240" y="135" width="55" height="55" rx="8"/>
      <rect x="300" y="135" width="55" height="55" rx="8"/>
      <rect x="360" y="135" width="55" height="55" rx="8"/>
      <rect x="420" y="135" width="55" height="55" rx="8"/>
      <rect x="480" y="135" width="55" height="55" rx="8"/>
      <rect x="540" y="135" width="55" height="55" rx="8"/>
      <rect x="600" y="135" width="55" height="55" rx="8"/>
    </g>
    <g font-size="24" font-weight="bold" fill="#0F5C66" text-anchor="middle">
      <text x="87"  y="170">Q</text>
      <text x="147" y="170">S</text>
      <text x="207" y="170">D</text>
      <text x="267" y="170">F</text>
      <text x="327" y="170">G</text>
      <text x="387" y="170">H</text>
      <text x="447" y="170">J</text>
      <text x="507" y="170">K</text>
      <text x="567" y="170">L</text>
      <text x="627" y="170">M</text>
    </g>
  </g>

  <!-- Third row: W X C V B N -->
  <g>
    <g fill="#FFFFFF" stroke="#0F5C66" stroke-width="2">
      <rect x="100" y="200" width="55" height="55" rx="8"/>
      <rect x="160" y="200" width="55" height="55" rx="8"/>
      <rect x="220" y="200" width="55" height="55" rx="8"/>
      <rect x="280" y="200" width="55" height="55" rx="8"/>
      <rect x="340" y="200" width="55" height="55" rx="8"/>
      <rect x="400" y="200" width="55" height="55" rx="8"/>
    </g>
    <g font-size="24" font-weight="bold" fill="#1F2937" text-anchor="middle">
      <text x="127" y="235">W</text>
      <text x="187" y="235">X</text>
      <text x="247" y="235">C</text>
      <text x="307" y="235">V</text>
      <text x="367" y="235">B</text>
      <text x="427" y="235">N</text>
    </g>
  </g>

  <!-- Space bar -->
  <rect x="160" y="265" width="380" height="40" rx="8" fill="#FFFFFF" stroke="#0F5C66" stroke-width="2"/>
  <text x="350" y="291" text-anchor="middle" font-size="16" fill="#6B7280">barre d'espace</text>

  <text x="350" y="315" text-anchor="middle" font-size="13" fill="#6B7280">Repère : les lettres A, Z et Q sont en haut à gauche — c'est le moyen le plus rapide de reconnaître un clavier AZERTY.</text>
</svg>
